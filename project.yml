name: MSTAssistant
options:
  bundleIdPrefix: com.moustache
  deploymentTarget:
    iOS: 15.0
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  MSTAssistant:
    type: application
    platform: iOS
    sources:
      - MSTAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moustache.mstassistant
        INFOPLIST_FILE: MSTAssistant/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
